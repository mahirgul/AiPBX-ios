name: iOS Build & Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the IPA and simulator build to this existing GitHub Release (e.g. v1.50.21)'
        required: false
        default: ''
        type: string
  release:
    types: [ published ]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write   # gh release upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set Xcode Version
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app || true
          
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          
          xcodebuild -version

      - name: Install xcodegen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build for iOS Simulator (Universal Release)
        run: |
          xcodebuild clean build \
            -project AiPBX.xcodeproj \
            -scheme AiPBX \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build iOS Archive (Device Release)
        run: |
          xcodebuild archive \
            -project AiPBX.xcodeproj \
            -scheme AiPBX \
            -destination "generic/platform=iOS" \
            -archivePath build/AiPBX.xcarchive \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload and IPA
        run: |
          mkdir -p build/Payload
          cp -r build/AiPBX.xcarchive/Products/Applications/AiPBX.app build/Payload/
          (cd build && zip -r AiPBX-unsigned.ipa Payload)
          (cd build/DerivedData/Build/Products/Release-iphonesimulator && zip -r "$GITHUB_WORKSPACE/build/AiPBX-Simulator.zip" AiPBX.app)

      - name: Upload iOS App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AiPBX-iOS-Build
          path: |
            build/AiPBX-unsigned.ipa
            build/AiPBX-Simulator.zip
          retention-days: 14

      - name: Attach IPA and simulator build to GitHub Release
        if: ${{ github.event_name == 'release' || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" build/AiPBX-unsigned.ipa build/AiPBX-Simulator.zip --clobber --repo "$GITHUB_REPOSITORY"
